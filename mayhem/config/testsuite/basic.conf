server s {
	tls no
}
workers 2
http_body_max 1024000
validator v_id regex ^[a-z0-9]*$
validator v_f function v_func
authentication a {
	authentication_type cookie
	authentication_value sid
	authentication_validator v_f
	authentication_uri /login
}
domain * {
	attach s
	redirect ^/old/(.*)$ 301 /new/$1
	return ^/gone$ 410
	route / {
		handler page
		methods get post
		validate get id v_id
		authenticate a
	}
}
